spring.application.name=eventify
server.port=8081

# Base de datos local MySQL para ejecutar y revisar datos.
spring.datasource.url=jdbc:mysql://localhost:3306/eventify_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123$qwe
spring.h2.console.enabled=false

# Flyway controla el esquema. Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logs SQL desactivados para mantener la consola limpia durante la ejecucion.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
spring.jpa.open-in-view=false

# Swagger UI disponible en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# El seed masivo ahora vive en Flyway V3. Se deja desactivado para no duplicar datos.
eventify.seed.enabled=false
