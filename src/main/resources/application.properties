spring.application.name=eventify
server.port=8080

# Base de datos local MySQL para ejecutar y revisar datos.
spring.datasource.url=jdbc:mysql://localhost:3306/eventify_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=
spring.datasource.password=
spring.h2.console.enabled=false

# Flyway controla el esquema. Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Observabilidad SQL solicitada por la HU.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger UI disponible en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# El seed masivo ahora vive en Flyway V3. Se deja desactivado para no duplicar datos.
eventify.seed.enabled=false
