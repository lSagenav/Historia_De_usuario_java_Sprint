<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo - Eventify</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:20px;
        }

        h1,h2{
            color:#333;
        }

        .container{
            width:90%;
            margin:auto;
        }

        .card{
            background:white;
            padding:20px;
            margin-bottom:30px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        form{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-bottom: 20px;
        }

        input{
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            flex:1;
            min-width: 200px;
        }

        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:15px;
        }

        table th,
        table td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        table th{
            background:#007bff;
            color:white;
        }

        table tr:nth-child(even){
            background:#f2f2f2;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #bee5eb;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Panel Administrativo Eventify</h1>

    <!-- SECCIÓN DE EVENTOS -->
    <div class="card">
        <h2>Registrar Evento</h2>

        <form th:action="@{/admin/events}" th:object="${event}" method="post">
            <input type="text"
                   th:field="*{nombre}"
                   placeholder="Nombre del evento"
                   required>

            <!-- NUEVO: Campo enlazado a la propiedad 'descripcion' de tu entidad Event -->
            <input type="text"
                   th:field="*{descripcion}"
                   placeholder="Descripción detallada del evento"
                   required>

            <input type="date"
                   th:field="*{fecha}"
                   required>

            <button type="submit">Guardar Evento</button>
        </form>

        <!-- Escenario 2 de la HU: Mensaje amigable si no hay eventos -->
        <div th:if="${#lists.isEmpty(events)}" class="alert-info">
            Actualmente no hay eventos programados.
        </div>

        <!-- Escenario 1 de la HU: Se muestra la tabla solo si existen registros -->
        <table th:unless="${#lists.isEmpty(events)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Fecha</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="eventItem : ${events}">
                <td th:text="${eventItem.id}"></td>
                <td th:text="${eventItem.nombre}"></td>
                <td th:text="${eventItem.descripcion}"></td>
                <td th:text="${eventItem.fecha}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- SECCIÓN DE VENUES -->
    <div class="card">
        <h2>Registrar Venue (Lugar)</h2>

        <form th:action="@{/admin/venues}" th:object="${venue}" method="post">
            <input type="text"
                   th:field="*{nombre}"
                   placeholder="Nombre del venue"
                   required>

            <input type="text"
                   th:field="*{ciudad}"
                   placeholder="Ciudad"
                   required>

            <!-- La capacidad se mantiene aquí para tu entidad Venue -->
            <input type="number"
                   th:field="*{capacidad}"
                   placeholder="Capacidad máxima de personas"
                   required>

            <button type="submit">Guardar Venue</button>
        </form>

        <!-- Mensaje amigable si no hay venues registrados -->
        <div th:if="${#lists.isEmpty(venues)}" class="alert-info">
            Actualmente no hay lugares registrados en el sistema.
        </div>

        <!-- Tabla de Venues -->
        <table th:unless="${#lists.isEmpty(venues)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Ciudad</th>
                <th>Capacidad</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="venueItem : ${venues}">
                <td th:text="${venueItem.id}"></td>
                <td th:text="${venueItem.nombre}"></td>
                <td th:text="${venueItem.ciudad}"></td>
                <td th:text="${venueItem.capacidad}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
